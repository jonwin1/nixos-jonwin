[dock]
enabled = true
icon_size = 20
position = "right"
reserve_space = false
smart_auto_hide = true

[idle]
behavior_order = [ "idle-behavior", "lock" ]
pre_action_fade_seconds = 5

    [idle.behavior.idle-behavior]
    action = "screen_off"
    enabled = true
    timeout = 300.0

