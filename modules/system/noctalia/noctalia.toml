[nightlight]
enabled = true
temperature_night = 3000

[notification]
history_retention_hours = 24
layer = "overlay"
background_opacity = 0.9
offset_y = 40
position = "top_center"

[osd]
position = "bottom_center"
background_opacity = 0.9
offset_y = 40

[plugin_settings."ezequiel/mango_layouts"]
panel_open_near_click = true
panel_placement = "attached"
panel_position = "auto"
show_deck = false
show_grid = false
show_monocle = false
show_vertical_deck = false
show_vertical_fair = false
show_vertical_grid = false
show_vertical_tile = false

[plugins]
enabled = [ "ezequiel/mango_layouts", "yocraft/battery-widget" ]

[shell]
avatar_path = "/home/jonwin/nixos-jonwin/modules/system/hypr/lock/logo.png"
clipboard_history_max_entries = 1000
clipboard_image_action_command = "satty -f -"
font_family = "FiraCode Nerd Font"
lang = "sv"
screen_time_enabled = true

    [shell.panel]
    control_center_placement = "floating"
    wallpaper_placement = "floating"
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    directory = "~/Pictures/screenshots"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "ghostty", "mango" ]
    community_ids = [ "zen-browser" ]

[wallpaper]
directory = "/home/jonwin/Pictures/wallpaper"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/jonwin/Pictures/wallpaper/20260801_164314.jpg"

[weather]
enabled = false

[widget.GPU]
show_value = false
stat = "gpu_usage"
type = "sysmon"
interactive = false

[widget.battery]
display_mode = "graphic"
show_label = false
interactive = false

[widget.bluetooth]
hide_when_no_connected_device = true
interactive = false

[widget.btn]
type = "ezequiel/mango_layouts:btn"

[widget.clock]
tooltip_format = "{:%A %d %B %Y}\\n{:%x v.%V}"
interactive = false

[widget.cpu]
show_value = false
interactive = false

[widget.media]
max_length = 300
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
show_label = false
interactive = false

[widget.notifications]
hide_when_no_unread = true
interactive = false

[widget.privacy]
hide_inactive = true
interactive = false

[widget.ram]
show_value = false
interactive = false

[widget.sysmon]
show_value = false
stat = "disk_used_pct"
interactive = false

[widget.temp]
show_value = false

    [widget.temp.actions]
    left = "none"
    middle = "none"

[widget.tray]
hide_passive = false

[widget.workspaces]
active_pill_size = 2.0
focused_output_only = true
hide_when_empty = true
interactive = false
scale = 1.1
show_labels = false
style = "focus_hint"
