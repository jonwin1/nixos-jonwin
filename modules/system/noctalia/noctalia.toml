config_version = 14

[bar]
order = [ "default", "bottom" ]

    [bar.default]
    position = "top"
    background_opacity = 0.0
    capsule = true
    capsule_opacity = 0.9
    capsule_padding = 8.0
    capsule_thickness = 0.85
    margin_ends = 0
    radius = 0
    reserve_space = false
    shadow = false
    start = [ ]
    center = [ "group:g1" ]
    end = [ "group:g2", "group:g3" ]

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "clock", "notifications", "privacy" ]
        opacity = 0.9
        padding = 8.0

        [[bar.default.capsule_group]]
        accordion = true
        accordion_direction = "start"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "temp", "cpu", "GPU", "ram", "sysmon" ]
        opacity = 0.9
        padding = 8.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "start"
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "bluetooth", "network", "battery" ]
        opacity = 0.9
        padding = 8.0
        widget_spacing = 8

    [bar.bottom]
    position = "bottom"
    background_opacity = 0.0
    capsule = true
    capsule_opacity = 0.9
    capsule_padding = 8.0
    capsule_thickness = 0.85
    margin_ends = 0
    radius = 0
    reserve_space = false
    shadow = false
    start = []
    center = [ "group:g1" ]
    end = [ "media" ]

        [[bar.bottom.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "workspaces", "tray" ]
        opacity = 0.9
        padding = 8.0
        widget_spacing = 12

[control_center]
hidden_tabs = [ "monitor", "weather" ]

    [control_center.calendar]
    show_events_card = false
    show_week_numbers = true

